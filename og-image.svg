<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1d3a"/>
      <stop offset="55%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="240" cy="315" r="320" fill="url(#glow)"/>
  <circle cx="980" cy="180" r="220" fill="url(#glow)"/>

  <g transform="translate(120 175)" filter="url(#shadow)">
    <rect width="280" height="280" rx="52" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <g transform="translate(60 38)">
      <path d="M80 0 C 110 50 160 100 160 130 a 80 80 0 0 1 -160 0 c 0 -30 50 -80 80 -130 z" fill="url(#drop)"/>
      <ellipse cx="40" cy="100" rx="18" ry="8" fill="#bfdbfe" opacity="0.85" transform="rotate(-30 40 100)"/>
    </g>
  </g>

  <g transform="translate(460 200)" font-family="Georgia,'Times New Roman',serif">
    <text x="0" y="0" font-size="86" font-weight="900" fill="#ffffff" letter-spacing="-2">Pristine</text>
    <text x="0" y="90" font-size="86" font-style="italic" font-weight="400" fill="#7dd3fc" letter-spacing="-2">Powerwashing</text>
  </g>

  <g transform="translate(460 360)" font-family="Helvetica,Arial,sans-serif">
    <text x="0" y="0" font-size="28" font-weight="600" fill="#cbd5e1" letter-spacing="1">
      Flat-rate exterior cleaning · Schedule online
    </text>
    <g transform="translate(0 38)">
      <rect width="220" height="56" rx="14" fill="#ffffff"/>
      <text x="110" y="36" font-size="20" font-weight="800" fill="#0b1d3a" text-anchor="middle" letter-spacing="1">
        BOOK A WASH
      </text>
    </g>
    <text x="240" y="74" font-size="20" font-weight="600" fill="#bfdbfe">pristine-powerwash.org</text>
  </g>
</svg>
